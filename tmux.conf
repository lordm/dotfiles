# improve colors
set -g default-terminal "tmux-256color"

# Integration with zsh & make it look nice with colors
set-option -g default-shell /bin/zsh

# Screen like binding
unbind C-b
set -g prefix C-a
bind a send-prefix

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload the config
bind-key r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel # "xclip -i -selection clipboard"

# open panes in current directory

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# Expect UTF-8, even if the terminal doesn't report it.
set -gq utf8 on
set -gq status-utf8 on

# Basic Options
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g set-titles on
set-option -g bell-action any
set-window-option -g automatic-rename off
set-option -g allow-rename off

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left                # window list starts at the left
set -g status-style "bg=colour235,fg=colour250"

# Left: session name, plus a prefix indicator. #{?client_prefix,...} is a native
# tmux format — it costs nothing, no shell-out.
set -g status-left "#[bg=colour39,fg=colour16,bold] #S #[default]#{?client_prefix,#[bg=colour203,fg=colour16#,bold] ^A #[default],} "
set -g status-left-length 24

# Window list — make the CURRENT window unmistakable. Z marks a zoomed pane
# (again a native format, free).
set -g window-status-format         "  #I:#W  "
set -g window-status-current-format "#[bg=colour39,fg=colour16,bold] #I:#W#{?window_zoomed_flag, Z,} #[default]"

# Right: load average + memory, via ONE bash process that reads only /proc.
# Anything here re-runs every status-interval, so it must stay cheap — see the
# header of scripts/tmux-status.sh for why that matters. Length is non-zero so
# tmux-continuum can still append its (invisible) auto-save hook.
set -g status-right "#[fg=colour245] #(~/scripts/tmux-status.sh) "
set -g status-right-length 40

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
