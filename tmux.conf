# improve colors
set -g default-terminal "tmux-256color"
# Declare 24-bit colour for ghostty. Without this tmux approximates hex to the
# nearest 256-colour slot, which mangles the brand palette below. Applies to
# clients attached after it is set.
set -as terminal-features ",xterm-ghostty:RGB"

# Integration with zsh & make it look nice with colors
set-option -g default-shell /bin/zsh

# Screen like binding
unbind C-b
set -g prefix C-a
bind a send-prefix

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload the config
bind-key r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel # "xclip -i -selection clipboard"

# open panes in current directory

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# Expect UTF-8, even if the terminal doesn't report it.
set -gq utf8 on
set -gq status-utf8 on

# Basic Options
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g set-titles on
set-option -g bell-action any
set-window-option -g automatic-rename off
set-option -g allow-rename off

# ── Status bar ──────────────────────────────────────────────
# Palette: Tehuti Labs "Cyber-Nile" (see tehuti-labs brand book).
#   Lapis  #1E3A8A   Gold  #D4AF37   Matte Black  #0A0A0A   Gray  #9CA3AF
# Gold is an accent only — the brand book forbids gold as a background.
set -g status on
set -g status-interval 5
set -g status-justify left                # window list starts at the left

set -g status-style "bg=#0A0A0A,fg=#9CA3AF"

# Left: session name. Lapis chip normally; the chip fills Gold while the prefix
# is armed. tmux re-expands style options on every redraw, so #{?client_prefix,...}
# works here — a native format, no shell-out, no cost.
# NOTE: inside #{?...} a comma separates the branches, so every literal comma in
# a #[style] must be escaped as #, — otherwise tmux splits the conditional at the
# first comma and the indicator silently renders as garbage. (It did.)
set -g status-left "#{?client_prefix,#[bg=#D4AF37#,fg=#0A0A0A#,bold] #S ,#[bg=#1E3A8A#,fg=#FFFFFF#,bold] #S }#[default] "
set -g status-left-length 24

# Window list — current window is a filled Lapis chip with gold text. Z marks a
# zoomed pane (native format, free).
set -g window-status-format         "#[fg=#9CA3AF]  #I:#W  "
set -g window-status-current-format "#[bg=#1E3A8A,fg=#D4AF37,bold] #I:#W#{?window_zoomed_flag, Z,} #[default]"

# Right: agent-tts state, then load average + memory — each its own ONE-process
# bash script reading only /proc or stat-ing a file. Anything here re-runs every
# status-interval, so it must stay cheap; see the headers of both scripts for
# why that matters.
#
# The tts icon goes first on purpose. status-right is right-aligned, so its
# rightmost content is what stays put: a segment whose width changes has to be
# on the left, or every state change drags the load figures sideways. The icon
# is a fixed width anyway now that it is always drawn, but the ordering means
# that stays true even if a future state prints something longer.
#
# The tts script emits its own colour, so colour245 is re-applied after it
# rather than once at the front. Length is non-zero so tmux-continuum can still
# append its (invisible) auto-save hook.
set -g status-right " #(~/scripts/tmux-tts-status.sh)  #[fg=colour245]#(~/scripts/tmux-status.sh) "
# Two columns for the icon plus its padding, and the load figures are not
# fixed-width: three double-digit averages plus "mem 100%" already reach 30, and
# a machine under load 100 would reach 32. 48 leaves room without having to
# think about it again.
set -g status-right-length 48

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'

# Agent narration, without leaving the current pane. S silences what is being
# said now; T mutes and unmutes, and persists across restarts. Both keys are
# free in tmux's own prefix table — unlike m/M (pane marking), t (clock),
# s (session tree) and q (pane numbers), which are all real built-ins.
# The status line shows the result: see scripts/tmux-tts-status.sh.
bind-key S run-shell "tts stop"
bind-key T run-shell "tts toggle"
